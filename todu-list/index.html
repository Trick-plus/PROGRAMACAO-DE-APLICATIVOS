<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tudo-list</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <script src="scripts.js"></script>
</head>

<body>
    <main class="container">
        <header class="header">
            <div>
                <h1>Minhas Tarefas</h1>
                <p>Organize seu dia e suas atividades</p>
            </div>

            <span class="material-symbols-outlined header-icon">
                checklist
            </span>
        </header>

        <div class="form-tarefa">
            <input type="text" id="input-tarefa" placeholder="Digita aqui mano">
            <button type="button">
                <span class="material-symbols-outlined">
                    add
                </span>
                Adicionar
            </button>
        </div>

        <nav class="filtros">
            <button type="button" class="filtro ativo">Todas</button>
            <button type="button" class="filtro">Pendentes</button>
            <button type="button" class="filtro">Conclídas</button>
        </nav>

        <ul id="lista-tarefas" class="lista-tarefas">
            <li class="tarefa">
                <button class="botoa-check" onclick="alternarTarefa">
                    <span class="material-symbols-outlined">
                        radio_button_unchecked
                    </span>
                </button>

                <span class="tarefa-texto">Estudar JS</span>

                <button class="botao-excluir" onclick="excluirTarefa">
                    <span class="material-symbols-outlined"> delete</span>
                </button>
            </li>
        </ul>
    </main>
</body>

</html>
