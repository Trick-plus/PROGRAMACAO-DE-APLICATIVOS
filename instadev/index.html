            <div class="modal-header">

                <button id="botaofecharmodal">

                    X

            </div>

            <div class="modal-body">

                <label for="imgPost">URL da imagem</label>
                <input type="text" id="imgPost" placeholder="https://">

                <label for="legendPost">Legenda</label>
                <textarea id="legendPost" placeholder="Digita essa bomba ai"></textarea>
                <button class="botaoPublicar" id="botaoPublicar" onclick="adicionarPost()">
                    PUBLICAR
                </button>


            </div>
        </div>
